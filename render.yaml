services:
  # Backend Spring Boot Service
  - type: web
    name: money-coach-backend
    env: docker
    dockerfilePath: money-coach-backend/money-coach-backend/Dockerfile
    dockerContext: money-coach-backend/money-coach-backend
    plan: free
    envVars:
      - key: PORT
        value: 5000

  # Frontend Static Service
  - type: web
    name: mukuru-money-coach-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html