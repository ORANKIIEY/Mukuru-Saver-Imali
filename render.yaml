# Render Blueprint Infrastructure-as-Code Configuration
# Mukuru Money Coach (SheHacks Challenge B)
# Unified Single-Port Web Application (Spring Boot Java 21 + React SPA)
#
services:
  # Unified Web Application (Frontend + Backend served on 1 Single Port)
  - type: web
    name: mukuru-app
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 5000
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx384m"