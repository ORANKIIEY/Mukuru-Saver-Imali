# Render Blueprint Infrastructure-as-Code Configuration
# Mukuru Money Coach (SheHacks Challenge B)
# Full Stack: Spring Boot API + React Vite Frontend + PostgreSQL Database

databases:
  - name: mukuru-db
    databaseName: mukuru_money_coach
    user: mukuru_user
    plan: free

services:
  # Backend Web Service (Spring Boot Java 21)
  - type: web
    name: mukuru-backend
    env: docker
    plan: free
    dockerfilePath: ./money-coach-backend/money-coach-backend/Dockerfile
    dockerContext: ./money-coach-backend/money-coach-backend
    envVars:
      - key: PORT
        value: 5000
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: mukuru-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: mukuru-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: mukuru-db
          property: password

  # Frontend Static Site (React + Vite)
  - type: web
    name: mukuru-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: mukuru-backend
          property: host
