# Render Blueprint Infrastructure-as-Code Configuration
# Mukuru Money Coach (SheHacks Challenge B)
# Unified Single-Port Web Application (Spring Boot Java 21 + React SPA + PostgreSQL)

databases:
  - name: mukuru-db
    databaseName: mukuru_money_coach
    user: mukuru_user
    plan: free

services:
  # Unified Web Application (Frontend + Backend served on 1 Single Port)
  - type: web
    name: mukuru-app
    env: docker
    plan: free
    dockerfilePath: ./money-coach-backend/money-coach-backend/Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 5000
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: mukuru-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: mukuru-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: mukuru-db
          property: password
